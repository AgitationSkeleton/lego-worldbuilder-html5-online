# The app (client/): built for Windows, macOS and Linux and published as a GitHub release (and
# its tag), which is where installed apps look for updates; and the Android app (mobile/), its
# .apk in the same release.  The app carries its own copy of the
# game, so it is built again whenever the game changes -- every push to main that touches the
# game or the app, as <major.minor of client/package.json>.<this workflow's run number> -- and
# on a version tag pushed by hand (v1.2.3), as that version.  An installed app finds the new
# one and installs it on quitting.
name: App
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['index.html', 'src/**', 'data/**', 'assets/**', 'client/**', 'mobile/**', '.github/workflows/app.yml']
permissions:
  contents: write
# (one release at a time, in order)
concurrency:
  group: app-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # (the history and tags: the notes are what changed since the last release)
      - name: The version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"
          else v="$(node -p "require('./client/package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The release's notes
        # What's new: release-notes.md when it changed since the last release (written by hand for a
        # release worth saying more about), else what each change since it was, in a line each; then
        # how to install it.
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          {
            echo "## What's new"
            echo
            if [ -f release-notes.md ] && { [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- release-notes.md; }; then
              cat release-notes.md
            else
              git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -v -i -E '^- (merge|restamp)' | head -40
            fi
            echo
            echo "## Installing"
            echo
            echo "The same game as the website (https://wbonline.viosarcade.xyz) at this version, with its score tables, races and random missions on the same server. Download the one for your device below."
            echo
            echo "- **Windows, macOS, Linux:** the app keeps itself up to date. Windows may warn that it doesn't know the publisher (More info, Run anyway); macOS wants a right-click and Open the first time."
            echo "- **Android:** open the .apk on the phone to install it, letting your browser install apps if asked. It says when a new one is out, to download over it."
            echo "- **iPhone and iPad:** install the website from Safari: Share, Add to Home Screen."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: A draft release for the builds to go in
        run: |
          gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --draft --title "LEGO World Builder Online v${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" || true
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: client
      - run: npm version "${{ needs.draft.outputs.version }}" --no-git-tag-version --allow-same-version
        working-directory: client
      - run: npx electron-builder --publish always
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
  # The Android app: signed with the release key (the WB_KEYSTORE_* secrets; mobile/README.md),
  # its version the release's and its version code this run's number.
  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - name: The release key
        run: echo "$WB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          WB_KEYSTORE_BASE64: ${{ secrets.WB_KEYSTORE_BASE64 }}
      - name: The APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleRelease "-PversionCode=${{ github.run_number }}" "-PversionName=${{ needs.draft.outputs.version }}" --no-daemon
        env:
          WB_KEYSTORE: ${{ runner.temp }}/release.jks
          WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
          WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
          WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
      - name: Into the release
        run: |
          f="LEGO-World-Builder-Online-${{ needs.draft.outputs.version }}-android.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$f"
          gh release upload "v${{ needs.draft.outputs.version }}" "$f" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: [draft, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release edit "v${{ needs.draft.outputs.version }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
